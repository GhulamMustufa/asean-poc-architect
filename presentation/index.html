<!DOCTYPE html>
<html lang="en">
<head>

  <script>

            cyan: {

              500: '#0EA5E9'

  <style>
    body {
      background-color: #070D19;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .slide-canvas {
      aspect-ratio: 16 / 9;
      max-height: 88vh;
      min-height: 520px;
    }
    @media (max-width: 768px) {
      body {
        overflow-y: auto !important;
      }
      main {
        padding: 0.75rem !important;
      }
      .slide-canvas {
        aspect-ratio: auto !important;
        max-height: none !important;
        min-height: calc(100vh - 120px) !important;
        height: auto !important;
        padding: 1.25rem 1rem !important;
        border-radius: 1rem !important;
      }
      .glass-card {
        padding: 1rem !important;
      }
    }
    @media (max-width: 480px) {
      main {
        padding: 0.5rem !important;
      }
      .slide-canvas {
        padding: 1rem 0.75rem !important;
        border-radius: 0.875rem !important;
      }
      .glass-card {
        padding: 0.85rem !important;
      }
    }
    .glass-card {
      background: rgba(17, 34, 64, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(35, 53, 84, 0.8);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0A192F;
    }
    ::-webkit-scrollbar-thumb {
      background: #233554;
      border-radius: 4px;
    }
    @media screen {
      #print-deck-container {
        display: none !important;
      }
    }
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #070D19 !important;
        overflow: visible !important;
      }
      header, main, #speaker-drawer, .no-print {
        display: none !important;
      }
      #print-deck-container {
        display: block !important;
      }
      .print-slide-page {
        width: 297mm !important;
        height: 210mm !important;
        max-width: 297mm !important;
        max-height: 210mm !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
        break-after: page !important;
        break-inside: avoid !important;
        padding: 16mm 22mm !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        background-color: #0A192F !important;
        border: none !important;
        overflow: hidden !important;

</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden antialiased select-none">

    <div class="flex items-center gap-2 sm:gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-cyan-400"></div>
      <a href="/" class="font-bold tracking-tight text-white text-xs sm:text-sm md:text-base hover:text-cyan-400 transition">POC-Architect</a>

    <!-- Slide Indicators -->
    <div class="hidden sm:flex items-center gap-1.5 bg-navy-950/80 px-3 py-1.5 rounded-full border border-navy-600" id="slide-indicators">

        <span class="hidden md:inline">Script</span>
      </button>
      <button onclick="exportToPdf()" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center gap-1 transition shadow-lg shadow-emerald-500/20" title="Export all 7 slides as clean PDF">
        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">PDF</span>
      </button>

        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">PPTX</span>
      </a>
      <button onclick="toggleFullscreen()" class="p-1.5 rounded-lg bg-navy-800 hover:bg-navy-700 border border-navy-600 text-slate-300 transition hidden sm:inline-flex" title="Toggle Fullscreen">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Presentation Viewport -->
  <main class="flex-1 flex items-center justify-center p-4 md:p-6 lg:p-8">
    <div id="deck-container" class="w-full max-w-6xl slide-canvas bg-navy-900 border border-navy-600 rounded-2xl shadow-2xl relative overflow-hidden flex flex-col justify-between p-6 md:p-10 lg:p-12 transition-all duration-300">
      
      <!-- Top Slide Category -->
      <div class="flex items-center justify-between mb-4">
        <span id="slide-category" class="text-xs font-mono font-bold tracking-widest text-cyan-400 uppercase">CATEGORY</span>
        <div class="text-xs font-mono text-slate-400">
          Slide <span id="current-slide-num" class="text-white font-bold">1</span> of 7
        </div>
      </div>

      <!-- Slide Dynamic Content Container -->
      <div id="slide-content" class="flex-1 flex flex-col justify-center">
        <!-- Rendered dynamically -->
      </div>

      <!-- Slide Footer Bar -->
      <div class="pt-3 border-t border-navy-600/60 flex items-center justify-between text-xs text-slate-400 mt-4">
        <div class="flex items-center gap-2">
          <span class="text-slate-400 font-medium text-[11px] sm:text-xs">Startup ASEAN • KL 2026</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="hidden md:inline text-[11px]">Swipe or use <kbd class="px-1.5 py-0.5 rounded bg-navy-800 border border-navy-600 text-[10px] text-slate-300">←</kbd> <kbd class="px-1.5 py-0.5 rounded bg-navy-800 border border-navy-600 text-[10px] text-slate-300">→</kbd></span>
          <div class="flex items-center gap-2">

            </button>
            <button onclick="nextSlide()" class="p-2 sm:p-1.5 rounded-lg bg-navy-800 hover:bg-navy-700 text-slate-200 border border-navy-600 transition flex items-center justify-center min-w-[36px] min-h-[36px]" title="Next Slide">

  </aside>

    let currentSlide = 0;

    function renderSlide(index) {
      currentSlide = index;
      const slide = SLIDES[index];

      // Update Top Meta
      document.getElementById('slide-category').innerText = slide.category;
      document.getElementById('current-slide-num').innerText = slide.id;
      const mobNum = document.getElementById('mobile-slide-num');
      if (mobNum) mobNum.innerText = slide.id;
      
      // Update Notes Drawer
      document.getElementById('slide-timer').innerText = slide.timer;
      document.getElementById('slide-goal').innerText = slide.goal;
      document.getElementById('notes-content').innerHTML = slide.notes;

      // Render Slide Content
      document.getElementById('slide-content').innerHTML = slide.render();

      // Scroll container to top on slide change
      const deckEl = document.getElementById('deck-container');
      if (deckEl) deckEl.scrollTop = 0;

      // Render Indicators
      renderIndicators();

      // Re-trigger Lucide Icons
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function renderIndicators() {
      const container = document.getElementById('slide-indicators');
      container.innerHTML = SLIDES.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="w-6 h-6 rounded-full text-[10px] font-mono font-bold transition flex items-center justify-center ${
          idx === currentSlide 
            ? 'bg-blue-600 text-white shadow-sm' 
            : 'text-slate-400 hover:text-white hover:bg-navy-800'
        }">
          ${idx + 1}
        </button>
      `).join('');
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < SLIDES.length) {
        renderSlide(idx);
      }
    }

    function toggleSpeakerNotes() {
      const drawer = document.getElementById('speaker-drawer');
      const isClosed = drawer.classList.contains('translate-x-full');
      if (isClosed) {
        drawer.classList.remove('translate-x-full');
      } else {
        drawer.classList.add('translate-x-full');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Error attempting to enable fullscreen:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 's' || e.key === 'S') {
        toggleSpeakerNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    function exportToPdf() {
      let printContainer = document.getElementById('print-deck-container');
      if (!printContainer) {
        printContainer = document.createElement('div');
        printContainer.id = 'print-deck-container';
        document.body.appendChild(printContainer);
      }

      printContainer.innerHTML = SLIDES.map((s, idx) => `
        <div class="print-slide-page">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"></span>
              <span class="text-xs font-mono font-bold tracking-widest text-cyan-400 uppercase">${s.category}</span>
            </div>
            <div class="text-xs font-mono text-slate-400">
              Slide <span class="text-white font-bold">${idx + 1}</span> of ${SLIDES.length}
            </div>
          </div>
          <div class="flex-1 flex flex-col justify-center my-auto">
            ${s.render()}
          </div>
          <div class="pt-4 border-t border-navy-600/60 flex items-center justify-between text-xs text-slate-400">
            <span class="text-slate-400 font-medium">Startup ASEAN • Hacktoberfest KL 2026</span>
            <span class="font-mono text-cyan-400 font-semibold">ASEAN POC-Architect</span>
          </div>
        </div>
      `).join('');

      if (window.lucide) {
        lucide.createIcons();
      }

      setTimeout(() => {
        window.print();
      }, 250);
    }

    // Mobile Touch Gesture Support (Swipe Left / Right to Change Slides)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          nextSlide(); // Swiped left -> Next
        } else {
          prevSlide(); // Swiped right -> Previous
        }
      }
    }, { passive: true });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
